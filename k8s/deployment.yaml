apiVersion: apps/v1
kind: Deployment
metadata:
  name: cress
  namespace: cress
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cress
  template:
    metadata:
      labels:
        app: cress
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: cress
          image: ghcr.io/ddmal/cress:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
